# Round 2: align V1-layer2, V4-layer6, IT-layer8 at once; weight 1/3 per area (sum 1): total CKA weight as in Round 1 student w1. Everything else as Round 1.
# Relative paths are resolved against the repository root (the folder that contains CordsNet/).
# Run with the shared training code: CordsNet/Round1/train/train.py (see CordsNet/Round2/README.md).

data:
  cache_dir: /scratch/wz2723/data/TVSD/round1_cache_monkeyN   # prepare/build_cache.py

model:
  checkpoint: CordsNet/checkpoints/cordsnetr8.pth
  n_classes: 1000
  n_timesteps: 100             # stimulus steps (200 ms at dt = 2 ms) = 20 bins x 5 steps
  idle_timesteps: 100          # run before the image, no gradient through them
  dt: 2.0
  tau: 10.0
  t_feedforward: 2.0
  t_recurrence: 2.0
  t_skip: 2.0

loss:
  w_ce: 1.0                    # weighted-mean CE, pseudo-labels
  ce_steps: [70, 100]          # outputs 70-99 = last 30 stimulus steps (142-200 ms), weights logspace(-3,0,30)
  estimator: CKA_S             # Song et al. 2012
  # alignment targets: one layer per area, two layers apart; bins [first, last] inclusive =
  # TVSD window start (bin containing it) to 200 ms; weight 1/3 per area (sum 1): total CKA weight as in Round 1 student w1
  targets:
    - {area: V1, layer: layer2, bins: [2, 19], weight: 0.3333333333}   # 20-200 ms
    - {area: V4, layer: layer6, bins: [5, 19], weight: 0.3333333333}   # 50-200 ms
    - {area: IT, layer: layer8, bins: [7, 19], weight: 0.3333333333}   # 70-200 ms (Round 1 IT bins)
  floor: 1.0e-6                # log(max(1 - CKA_S, floor))

train:
  batch_size: 64               # as Round 1 (92.8 GB on H200 with one target); check with memtest before submitting
  epochs: 10                   # as Round 1
  lr: 3.0e-5                   # pilot 2026-11-09 (1 epoch): 1e-4 disrupts the model early (train CE 0.9 -> 2.3, val CE worse); 1e-5 smallest CKA gain
  weight_decay: 0.01           # AdamW
  grad_clip: 1000.0            # loose; clipping is logged
  precision: fp32              # bf16 changes 9.4% of last-step predictions vs fp32; saves only ~10% memory, not faster
  seed: 2723                   # same for student and control -> same batches
  log_every: 20
  max_steps: null              # per epoch; only for pilots

eval:                          # identical to epoch 0
  splits: [val]
  batch_size: 64
  seed: 2723
  layers: [layer1, layer2, layer3, layer4, layer5, layer6, layer7, layer8]
  areas: [V1, V4, IT]
  at_start: true               # evaluate before training (should reproduce epoch 0)

runtime:
  output_dir: CordsNet/Round2/outputs/multi3_w0p33each
  device: cuda

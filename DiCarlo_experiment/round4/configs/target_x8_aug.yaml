# Round 4 target, second attempt: DyRCNNx8 WITH data augmentation.
# Identical to target_x8.yaml except the `augmentation` section and the output
# folder. Why: without augmentation target_x8 memorized the training images
# within ~8 epochs (best val CE at epochs_completed 8, train CE ~0.001 later).
# The transforms are DynVision's Imagenette training preset
# (dynvision/configs/config_data.yaml) without its Resize/CenterCrop, which
# the image cache already applied. Training batches only: validation, the
# train-set evaluation, the target cache and the students see un-augmented
# images. The students stay DyRCNNx4 without augmentation.

experiment:
  name: "target_x8_aug"
  description: "DyRCNNx8 target, ground-truth labels, same dynamics settings and recipe as target_r3, plus DynVision Imagenette augmentation"

data:
  image_dir: "/scratch/wz2723/dynvision/cache/imagenette_images"
  split_file: "/scratch/wz2723/dynvision/DynVision/DiCarlo_experiment/runs/alignment_run_01/data/split.json"
  batch_size: 32
  shuffle_seed: 7000
  num_workers: 8                 # node has 12 CPUs

augmentation:                  # training batches only; target_x8 / target_r3: none
  transforms:
    - "RandomRotation(10)"
    - "RandomAffine(0, translate=(0.1, 0.1))"
    - "RandomHorizontalFlip()"
    - "ColorJitter(brightness=0.2, contrast=0.2, saturation=0.2)"

model:
  model_class: "dynvision.models:DyRCNNx8"   # round 3: DyRCNNx4
  kwargs:
    n_classes: 10
    input_dims: [1, 3, 224, 224]
    n_timesteps: 20
    dt: 2
    tau: 9
    t_feedforward: 0
    t_recurrence: 6              # ms (3 steps)
    t_feedback: 12               # ms (6 steps)
    t_skip: 0
    recurrence_type: "pointdepthwise"
    recurrence_target: "output"
    skip: true
    feedback: "add"
  init_seed: 7000                # students use 2723 / 2724 / 2725
  initialize_lazy: true

loss:
  ce_first_timestep: 4           # CE over t4..t19 (8 ms reaction time)

optimization:
  epochs: 200
  optimizer: "adamw"
  learning_rate: 1.41e-4
  weight_decay: 0.01             # decoupled
  betas: [0.9, 0.999]
  eps: 1.0e-8
  lr_group_factors: {recurrence: 0.2, feedback: 0.5}
  accumulate_grad_batches: 1
  max_grad_norm: 500.0
  scheduler: "cosine"
  cosine_t_max: 200

runtime:
  device: "cuda"
  precision: "bfloat16"
  output_dir: "/scratch/wz2723/dynvision/runs/round4/target_x8_aug"
  log_every_n_steps: 20
  deterministic_cudnn: false

checkpoint:
  select: "best"                 # the target used downstream
  monitor: "val_ce_loss"
  mode: "min"
  save_every_n_epochs: 10
  eval_train_every_n_epochs: 10  # train-set accuracy in eval mode (memorization check)
  eval_init: true                # first metrics.csv row = initial weights (epochs_completed 0)
  verify_reload: true            # chosen checkpoint must reload with load_trained_target

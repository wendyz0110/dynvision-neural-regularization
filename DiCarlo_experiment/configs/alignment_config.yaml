# First-run config for train_alignment.py (decisions from 2026-10-05).
# Anything not listed here uses the defaults in train_alignment.py.
# Edit the two paths marked EDIT before running on Torch.

data:
  factory: "utils.data_utils:build_dataloaders"
  root: "/scratch/<netid>/data/imagenette2-320"   # EDIT: unpacked imagenette2-320
  val_ratio: 0.2              # 80/20 split of the official train/ folder
  split_seed: 2723
  split_file: null            # set to an earlier run's data/split.json to reuse it
  batch_size: 64              # fall back to 48 if it does not fit in GPU memory
  num_workers: 4
  train_augmentation: true    # target's own augmentation set; train loader only
  input_timesteps: 20

target:
  checkpoint_path: "/scratch/<netid>/DiCarlo_experiment/x4_generators_tfb12/x4_pointdepthwise_tfb12/trained.pt"   # EDIT
  pseudo_label_timestep: -1   # pseudo-label = target prediction at the last step

alignment:
  layer: "IT"
  timestep: -1                # align IT at the last timestep
  ce_weight: 1.0
  cka_weight: 1.0
  ce_first_timestep: 4        # CE on steps 4..19 (target: lossrt=8 ms, dt=2 ms)
  warmup_epochs: 0
  min_cka_batch_size: 16

optimization:
  epochs: 100
  learning_rate: 2.0e-4       # for batch 64; rule: 2e-4 * sqrt(batch / 64)
  weight_decay: 5.0e-4
  lr_group_factors: {recurrence: 0.2, feedback: 0.5}
  accumulate_grad_batches: 1
  max_grad_norm: null

runtime:
  seed: 2723                  # must differ from the target's 7000
  device: "cuda"
  precision: "bfloat16"
  output_dir: "outputs/alignment_run_01"
  log_every_n_steps: 20

checkpoint:
  save_last: true             # evaluation uses *_last.pt
  save_every_n_epochs: 10     # same-epoch checkpoints for trajectory curves

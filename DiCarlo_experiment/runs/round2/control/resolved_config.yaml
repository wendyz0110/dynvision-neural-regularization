experiment:
  role: control
  description: CE only (no alignment term)
cache:
  image_dir: /scratch/wz2723/dynvision/cache/imagenette_images
  target_dir: /scratch/wz2723/dynvision/cache/targets/x4_surrogate
data:
  root: /scratch/wz2723/dynvision/data/imagenette2-320
  val_ratio: 0.2
  split_seed: 2723
  split_file: /scratch/wz2723/dynvision/DynVision/DiCarlo_experiment/runs/alignment_run_01/data/split.json
  batch_size: 32
  input_timesteps: 20
  shuffle_seed: 2723
  num_workers: 8
student:
  model_class: dynvision.models:DyRCNNx4
  config_path: null
  overrides: {}
  use_current_defaults: true
  initialize_lazy: true
  probe_shape:
  - 1
  - 20
  - 3
  - 224
  - 224
